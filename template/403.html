{% extends "base.html" %}

{% block title %}Access denied{% endblock %}

{% block content %}
<div class="container-page py-24 text-center">
  <p class="text-sm font-semibold text-brand-600">403</p>
  <h1 class="mt-2 text-4xl font-bold tracking-tight">You don't have access to this page</h1>
  <p class="mt-4 text-gray-600">{{ exception or "Ask an administrator if you need access." }}</p>
  <a href="{{ url('core:home') }}" class="btn btn-primary mt-8">Back to home</a>
</div>
{% endblock %}
